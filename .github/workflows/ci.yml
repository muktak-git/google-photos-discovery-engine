name: CI Pipeline & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Lint, Test & Verification Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .
          pip install google-play-scraper app-store-scraper requests urllib3 ruff

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Unit & Integration Test Suite (69 Tests)
        run: |
          python -m unittest discover tests

      - name: Verify Quote Integrity & Zero PII Leakage
        run: |
          python -c "
          import json
          from pathlib import Path
          ckpt = Path('data/checkpoint.json')
          if ckpt.exists():
              data = json.loads(ckpt.read_text(encoding='utf-8'))
              print('Checkpoint verified:', data.get('last_completed_stage'))
          "
