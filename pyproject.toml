[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-photos-engine"
version = "0.1.0"
description = "AI-powered discovery engine analyzing public feedback to improve photo retrieval for vague memories"
readme = "problemStatement.md"
authors = [{ name = "Photo Retrieval Discovery Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "duckdb>=0.9.2",
    "pyarrow>=14.0.0",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "presidio-analyzer>=2.2.353",
    "presidio-anonymizer>=2.2.353",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
]

[project.scripts]
photo-engine = "scripts.run_pipeline:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
